<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>知序 Rokid 演示</title><style>
body {margin:0;background:#080b10;color:#fff;font:18px system-ui;line-height:1.6}main {max-width:640px;margin:auto;padding:24px}h1{font-size:26px}.panel{border:1px solid #596675;border-radius:16px;padding:20px}article{margin:16px 0;padding:12px;border-left:3px solid #66dbbd}button{font:inherit;padding:8px;margin:4px;background:#223546;color:white;border:1px solid #8196aa;border-radius:8px}button:focus-visible{outline:3px solid #66dbbd}.muted{color:#b7c6d2}small{overflow-wrap:anywhere}nav{display:flex;flex-wrap:wrap}button:disabled{opacity:.55}
</style><main><h1>知序 · 眼镜报告</h1><p class="muted">演示数据 · 未连接真实知序或推送服务</p><div class="panel"><div id="summary"></div><p id="status" role="status"></p><div id="rows"></div><small id="updated"></small><nav><button id="previous">上一页</button><span id="page"></span><button id="next">下一页</button><button id="refresh">刷新</button></nav></div><h2>测试场景</h2><button id="offline">模拟断网</button><button id="empty">空报告</button><button id="update">模拟更新事件</button><button id="attach">显示组件</button><button id="detach">隐藏组件</button><p>这是浏览器预览，不是眼镜真机验收。更新事件仅模拟失效通知；不代表后台推送可用。</p></main><script type="module" src="/app.js"></script></html>
